name: Validate and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Let an active production deployment finish. New PR revisions can cancel old checks.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Build, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: randomizer_test
          POSTGRES_USER: postgres
          # This disposable CI database holds test fixtures only, never production data.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d randomizer_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test backend with SQLite and PostgreSQL
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres@localhost:5432/randomizer_test
        run: python -m pytest -q -rs
      - name: Test deployment status handling
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v

  deploy:
    name: Deploy production
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      FRONTEND_URL: https://randomizer-weld-one.vercel.app
      BACKEND_URL: https://randomizer-smj8.onrender.com
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check deployment configuration
        shell: bash
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID RENDER_API_KEY RENDER_SERVICE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub Actions secret: $name. See docs/deployment.md."
              missing=1
            fi
          done
          exit "$missing"
      - name: Reject an outdated main run
        shell: bash
        run: |
          current_main=$(git ls-remote origin refs/heads/main | cut -f1)
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "::error::This commit is no longer the head of main. Run the workflow for the latest main commit."
            exit 1
          fi
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Vercel CLI
        run: npm install --global vercel@62.7.0
      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build production frontend
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy backend and wait for the requested commit
        run: python .github/scripts/deploy_render.py
      - name: Check backend health
        shell: bash
        run: |
          curl --fail --silent --show-error --connect-timeout 10 --max-time 60 \
            --retry 5 --retry-delay 5 --retry-max-time 180 \
            "$BACKEND_URL/api/health" |
            jq -e '.status == "ok" and .signIn == true and .storage == "postgres"'
          status=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' "$BACKEND_URL/api/me/setup")
          if [[ "$status" != 401 ]]; then
            echo "::error::Saved setups should reject anonymous requests with HTTP 401; got $status."
            exit 1
          fi
      - name: Deploy frontend and wait for Vercel
        shell: bash
        run: |
          deployment_url=$(vercel deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN" \
            --meta githubCommitSha="$GITHUB_SHA" --meta githubCommitRef=main)
          echo "### Vercel deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$deployment_url" >> "$GITHUB_STEP_SUMMARY"
      - name: Check public frontend and sign-in callback
        shell: bash
        run: |
          for path in / /redirect.html; do
            curl --fail --silent --show-error --connect-timeout 10 --max-time 30 \
              --retry 5 --retry-delay 5 --retry-max-time 120 \
              --output /dev/null "$FRONTEND_URL$path"
          done
          {
            echo "### Production verification"
            echo "Commit: $GITHUB_SHA"
            echo "Frontend: $FRONTEND_URL"
            echo "Backend: $BACKEND_URL/api/health"
            echo "HTTP smoke checks passed. Real sign-in and save/reload still require a browser check."
          } >> "$GITHUB_STEP_SUMMARY"
